openapi: 3.0.3
info:
  title: C3 Web V0 API
  version: 0.1.0
  description: People + AddPerson governed vertical slice.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /health:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
                additionalProperties: false
  /ready:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checks:
                    type: object
                    properties:
                      app:
                        type: string
                      directory:
                        type: string
                    required:
                      - app
                      - directory
                    additionalProperties: false
                  unchecked:
                    type: array
                    items:
                      type: string
                required:
                  - status
                  - checks
                  - unchecked
                additionalProperties: false
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checks:
                    type: object
                    properties:
                      app:
                        type: string
                      directory:
                        type: string
                    required:
                      - app
                      - directory
                    additionalProperties: false
                  unchecked:
                    type: array
                    items:
                      type: string
                required:
                  - status
                  - checks
                  - unchecked
                additionalProperties: false
  /version:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  buildToken:
                    type: string
                    nullable: true
                  environmentName:
                    type: string
                    nullable: true
                  projectId:
                    type: string
                    nullable: true
                  deploymentId:
                    type: string
                    nullable: true
                required:
                  - buildToken
                  - environmentName
                  - projectId
                  - deploymentId
                additionalProperties: false
  /api/v1/me:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  identity:
                    type: string
                  displayName:
                    type: string
                  role:
                    type: string
                    enum:
                      - owner
                      - operations
                      - legal
                      - finance
                      - hr
                      - management
                      - visitor
                  tenantSlug:
                    type: string
                  capabilities:
                    type: object
                    properties:
                      canReadPeople:
                        type: boolean
                      canSubmitApproval:
                        type: boolean
                      canReviewApproval:
                        type: boolean
                      canExecuteApproval:
                        type: boolean
                      canReadMembers:
                        type: boolean
                      canSubmitMemberChange:
                        type: boolean
                      canOperateJourneys:
                        type: boolean
                      canManageKit:
                        type: boolean
                      canManageApparel:
                        type: boolean
                      canManageMissions:
                        type: boolean
                      canManageEntities:
                        type: boolean
                      canManageIntake:
                        type: boolean
                      canManageSubscriptions:
                        type: boolean
                      canReadAgreements:
                        type: boolean
                      canViewFinancials:
                        type: boolean
                      canViewPerDiem:
                        type: boolean
                      canSubmitClaim:
                        type: boolean
                      canReadClaims:
                        type: boolean
                      canDecideClaim:
                        type: boolean
                      canManageDelegations:
                        type: boolean
                      canViewSituation:
                        type: boolean
                      canViewPersonPII:
                        type: boolean
                    required:
                      - canReadPeople
                      - canSubmitApproval
                      - canReviewApproval
                      - canExecuteApproval
                      - canReadMembers
                      - canSubmitMemberChange
                      - canOperateJourneys
                      - canManageKit
                      - canManageApparel
                      - canManageMissions
                      - canManageEntities
                      - canManageIntake
                      - canManageSubscriptions
                      - canReadAgreements
                      - canViewFinancials
                      - canViewPerDiem
                      - canSubmitClaim
                      - canReadClaims
                      - canDecideClaim
                      - canManageDelegations
                      - canViewSituation
                      - canViewPersonPII
                    additionalProperties: false
                  userId:
                    type: string
                    format: uuid
                required:
                  - identity
                  - displayName
                  - role
                  - tenantSlug
                  - capabilities
                  - userId
                additionalProperties: false
  /api/v1/people:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      properties:
                        personId:
                          type: string
                        fullName:
                          type: string
                        ign:
                          type: string
                          nullable: true
                        nationality:
                          type: string
                          nullable: true
                        primaryRole:
                          type: string
                          nullable: true
                        personnelCode:
                          type: string
                          nullable: true
                        currentTeam:
                          type: string
                          nullable: true
                        currentGameTitle:
                          type: string
                          nullable: true
                        primaryDepartment:
                          type: string
                          nullable: true
                        entityId:
                          type: string
                          nullable: true
                        notes:
                          type: string
                          nullable: true
                        firstName:
                          type: string
                          nullable: true
                        lastName:
                          type: string
                          nullable: true
                        otherNationalities:
                          type: array
                          items:
                            type: string
                        position:
                          type: string
                          nullable: true
                        dateOfJoining:
                          type: string
                          nullable: true
                        dateOfBirth:
                          type: string
                          nullable: true
                        photoUpdatedAt:
                          type: string
                          nullable: true
                        addressLine1:
                          type: string
                          nullable: true
                        addressLine2:
                          type: string
                          nullable: true
                        addressCity:
                          type: string
                          nullable: true
                        addressCountry:
                          type: string
                          nullable: true
                        phone:
                          type: string
                          nullable: true
                        email:
                          type: string
                          nullable: true
                        isActive:
                          type: boolean
                        version:
                          type: integer
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                      required:
                        - personId
                        - fullName
                        - ign
                        - nationality
                        - primaryRole
                        - personnelCode
                        - currentTeam
                        - currentGameTitle
                        - primaryDepartment
                        - entityId
                        - notes
                        - firstName
                        - lastName
                        - otherNationalities
                        - position
                        - dateOfJoining
                        - isActive
                        - version
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                required:
                  - people
                additionalProperties: false

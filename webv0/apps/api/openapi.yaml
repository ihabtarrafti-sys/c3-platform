  /api/v1/people/{personId}/identity-request:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patch:
                  type: object
                  properties:
                    fullName:
                      type: string
                      minLength: 1
                      maxLength: 200
                    firstName:
                      type: string
                      maxLength: 120
                      nullable: true
                    lastName:
                      type: string
                      maxLength: 120
                      nullable: true
                    dateOfBirth:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                      nullable: true
                    nationality:
                      type: string
                      maxLength: 120
                      nullable: true
                    otherNationalities:
                      type: array
                      items:
                        type: string
                        minLength: 1
                        maxLength: 120
                      maxItems: 8
                  additionalProperties: false
                reason:
                  type: string
                  maxLength: 500
              required:
                - patch
              additionalProperties: false
      parameters:
        - schema:
            type: string
            pattern: ^PER-\d{4,}$
          in: path
          name: personId
          required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    type: object
                    properties:
                      approvalId:
                        type: string
                      operationType:
                        type: string
                        enum:
                          - AddPerson
                          - ProvisionMember
                          - ChangeRole
                          - DeactivateMember
                          - ReactivateMember
                          - AddCredential
                          - DeactivateCredential
                          - ReactivateCredential
                          - InitiateJourney
                          - AddMissionParticipant
                          - RemoveMissionParticipant
                          - AddAgreement
                          - RenewAgreement
                          - TerminateAgreement
                          - AddAgreementTerm
                          - UpdateAgreementTerm
                          - RemoveAgreementTerm
                          - ImportBatch
                          - UpdatePersonIdentity
                          - DeactivatePerson
                          - ReactivatePerson
                          - UpdateCredentialFacts
                          - AddBeneficiary
                          - UpdateBeneficiary
                          - RetireBeneficiary
                      targetPersonId:
                        type: string
                      targetId:
                        type: string
                        nullable: true
                      reason:
                        type: string
                        nullable: true
                      status:
                        type: string
                        enum:
                          - Submitted
                          - InReview
                          - Approved
                          - Rejected
                          - Executed
                          - ExecutionFailed
                          - Withdrawn
                      submittedBy:
                        type: string
                      submittedAt:
                        type: string
                      reviewedBy:
                        type: string
                        nullable: true
                      reviewedAt:
                        type: string
                        nullable: true
                      rejectionReason:
                        type: string
                        nullable: true
                      executedAt:
                        type: string
                        nullable: true
                      executionError:
                        type: string
                        nullable: true
                      version:
                        type: integer
                      editCount:
                        type: integer
                      revisionOf:
                        type: string
                        nullable: true
                      supersededBy:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                      payload:
                        type: object
                        additionalProperties: {}
                    required:
                      - approvalId
                      - operationType
                      - targetPersonId
                      - targetId
                      - reason
                      - status
                      - submittedBy
                      - submittedAt
                      - reviewedBy
                      - reviewedAt
                      - rejectionReason
                      - executedAt
                      - executionError
                      - version
                      - editCount
                      - revisionOf
                      - supersededBy
                      - createdAt
                      - updatedAt

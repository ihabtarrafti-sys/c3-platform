      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion:
                  type: integer
                  minimum: 0
                patch:
                  type: object
                  properties:
                    ign:
                      type: string
                      maxLength: 120
                      nullable: true
                    primaryRole:
                      type: string
                      maxLength: 120
                      nullable: true
                    personnelCode:
                      type: string
                      maxLength: 60
                      nullable: true
                    currentTeam:
                      type: string
                      maxLength: 120
                      nullable: true
                    currentGameTitle:
                      type: string
                      maxLength: 120
                      nullable: true
                    primaryDepartment:
                      type: string
                      maxLength: 120
                      nullable: true
                    entityId:
                      type: string
                      nullable: true
                    notes:
                      type: string
                      maxLength: 2000
                      nullable: true
                    position:
                      type: string
                      maxLength: 120
                      nullable: true
                    dateOfJoining:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                      nullable: true
                    addressLine1:
                      type: string
